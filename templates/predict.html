<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prédiction du Diabète</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #65ccbe, #ffffff);
      color: #a2e5df;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .container { width: 100%; max-width: 600px; }

    form, #result {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
    }

    form { padding: 32px; border: 1px solid #e5eaf2; }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #172554;
    }

    h1::after {
      content: "";
      display: block;
      width: 55px;
      height: 4px;
      margin: 12px auto 25px;
      border-radius: 10px;
      background: #137873;
    }

    label {
      display: block;
      margin-top: 17px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    input {
      width: 100%;
      margin-top: 7px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:hover { border-color: #94a3b8; }
    input:focus {
      background: #ffffff;
      border-color: #50dbc7;
      box-shadow: 0 0 0 3px rgb(68 165 152);
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 13px 20px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, #65ccbe, #186567);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 15px rgb(101 204 190);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgb(68 165 152);
    }

    button:active { transform: translateY(0); }


  </style>
</head>
<body>
  <div class="container">
    <form id="form">
      <h1>Prédiction du diabète</h1>

      <label>Grossesses (pregnancies)
        <input type="number" name="pregnancies" value="2" required>
      </label>
      <label>Glucose
        <input type="number" step="0.1" name="glucose" value="120" required>
      </label>
      <label>Pression artérielle (blood_pressure)
        <input type="number" step="0.1" name="blood_pressure" value="70" required>
      </label>
      <label>Épaisseur peau (skin_thickness)
        <input type="number" step="0.1" name="skin_thickness" value="25" required>
      </label>
      <label>Insuline
        <input type="number" step="0.1" name="insulin" value="80" required>
      </label>
      <label>BMI
        <input type="number" step="0.1" name="bmi" value="28.5" required>
      </label>
      <label>Diabetes Pedigree Function
        <input type="number" step="0.01" name="diabetes_pedigree" value="0.5" required>
      </label>
      <label>Âge
        <input type="number" name="age" value="35" required>
      </label>

      <button type="submit">Prédire</button>
    </form>

    <div id="result"></div>
  </div>
<script>
  const form = document.getElementById('form');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(form));

    for (const key in data) {
      data[key] = Number(data[key]);
    }

    try {
      const res = await fetch('/predire', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });

      const json = await res.json();

      if (!res.ok) {
        alert(
          '❌ Erreur\n\n' +
          (json.detail || 'Une erreur est survenue.')
        );
        return;
      }

      const result = json.result;
      const confidence = (json.confidence * 100).toFixed(1);
      const algorithm = json.algorithm;

      alert(
        '🩺 Résultat de la prédiction\n\n' +
        'Résultat : ' + result + '\n' +
        'Confiance : ' + confidence + '%\n' +
        'Algorithme : ' + algorithm
      );

    } catch (err) {

      alert(
        '❌ Erreur réseau\n\n' +
        'Impossible de contacter le serveur.\n' +
        err.message
      );
    }
  });
</script>
</body>
</html>
