name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/mlops-pipeline:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/mlops-pipeline:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/mlops-pipeline:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/mlops-pipeline:latest

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/mlops-api \
            api=ghcr.io/${{ github.repository_owner }}/mlops-pipeline:${{ github.sha }} \
            -n mlops
