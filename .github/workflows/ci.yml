name: MLOps Pipeline CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Java (PySpark)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt


    - name: Run pipeline (preprocess + train)
      run: |
        python src/preprocess_spark.py
        python src/train.py

    - name: Run pytest
      run: python -m pytest src/test_pipeline.py -v


    - name: Upload trained model artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          models/
          metrics.json

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download trained model artifact
      uses: actions/download-artifact@v4
      with:
        name: trained-model

    - name: Build Docker image
      run: docker build -t mlops-pipeline:latest .

    - name: Test API container
      run: |
        docker run -d -p 8000:8000 --name test-api mlops-pipeline:latest
        for i in {1..10}; do
          curl -sf http://localhost:8000/health && break
          echo "API... ($i/10)"
          sleep 3
        done
        curl -sf http://localhost:8000/health || (docker logs test-api && exit 1)
        docker stop test-api